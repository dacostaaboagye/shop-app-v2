services:
  api:
    image: ${SHOP_API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      NODE_ENV: production
      PLATFORM_EVENT_DELIVERY_ENABLED: "false"
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: ${SHOP_API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      NODE_ENV: production
      PLATFORM_EVENT_DELIVERY_ENABLED: "true"
    command: ["node", "dist/src/workers/platform-event-delivery-worker.js"]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ${SHOP_WEB_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
