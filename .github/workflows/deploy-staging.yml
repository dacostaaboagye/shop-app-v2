name: Deploy Staging

on:
  push:
    branches:
      - staging
      - stagging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  migrate_database:
    runs-on: ubuntu-latest
    needs: verify
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:staging:migrate

  deploy_api:
    runs-on: ubuntu-latest
    needs: migrate_database
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.STAGING_FLY_API_TOKEN }}
      STAGING_FLY_APP_NAME: ${{ secrets.STAGING_FLY_APP_NAME }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.STAGING_AUTH_ACCESS_TOKEN_SECRET }}
      STAGING_WEB_BASE_URL: ${{ secrets.STAGING_WEB_BASE_URL }}
      STAGING_AUTH_COOKIE_SECURE: ${{ secrets.STAGING_AUTH_COOKIE_SECURE }}
      STAGING_GOOGLE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
      STAGING_GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
      STAGING_GOOGLE_CALLBACK_URL: ${{ secrets.STAGING_GOOGLE_CALLBACK_URL }}
      STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
      STAGING_EMAIL_FROM_ADDRESS: ${{ secrets.STAGING_EMAIL_FROM_ADDRESS }}
      STAGING_RESEND_WEBHOOK_SECRET: ${{ secrets.STAGING_RESEND_WEBHOOK_SECRET }}
      STAGING_R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
      STAGING_R2_BUCKET: ${{ secrets.STAGING_R2_BUCKET }}
      STAGING_R2_PUBLIC_URL: ${{ secrets.STAGING_R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Sync staging secrets to Fly
        run: |
          cat <<EOF > fly.staging.secrets
          NODE_ENV=production
          DATABASE_URL=${STAGING_DATABASE_URL}
          AUTH_ACCESS_TOKEN_SECRET=${STAGING_AUTH_ACCESS_TOKEN_SECRET}
          AUTH_ACCESS_TOKEN_TTL_SECONDS=900
          AUTH_REFRESH_TOKEN_TTL_SECONDS=604800
          AUTH_COOKIE_SECURE=${STAGING_AUTH_COOKIE_SECURE:-true}
          WEB_BASE_URL=${STAGING_WEB_BASE_URL}
          EMAIL_FROM_ADDRESS=${STAGING_EMAIL_FROM_ADDRESS}
          GOOGLE_CLIENT_ID=${STAGING_GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${STAGING_GOOGLE_CLIENT_SECRET}
          GOOGLE_CALLBACK_URL=${STAGING_GOOGLE_CALLBACK_URL:-${STAGING_WEB_BASE_URL%/}/api/auth/oauth/google/callback}
          RESEND_API_KEY=${STAGING_RESEND_API_KEY}
          RESEND_WEBHOOK_SECRET=${STAGING_RESEND_WEBHOOK_SECRET}
          R2_ACCOUNT_ID=${STAGING_R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${STAGING_R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${STAGING_R2_SECRET_ACCESS_KEY}
          R2_BUCKET=${STAGING_R2_BUCKET}
          R2_PUBLIC_URL=${STAGING_R2_PUBLIC_URL}
          EOF
          flyctl secrets import --app "$STAGING_FLY_APP_NAME" < fly.staging.secrets
      - name: Deploy API and worker to Fly
        run: |
          flyctl deploy \
            --remote-only \
            --config apps/api/fly.staging.toml \
            --app "$STAGING_FLY_APP_NAME"
      - name: Ensure API and worker process groups are running
        run: |
          flyctl scale count \
            api=1 \
            worker=1 \
            --app "$STAGING_FLY_APP_NAME"

  deploy_web:
    runs-on: ubuntu-latest
    needs: deploy_api
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
      STAGING_VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
      STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$STAGING_VERCEL_TOKEN" ] && missing="$missing STAGING_VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing STAGING_VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing STAGING_VERCEL_PROJECT_ID"
          [ -z "$STAGING_API_BASE_URL" ] && missing="$missing STAGING_API_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
      - name: Pull Vercel project settings
        run: |
          pnpm dlx vercel@latest pull \
            --yes \
            --environment=production \
            --token "$STAGING_VERCEL_TOKEN"
      - name: Deploy web to Vercel staging project
        run: |
          pnpm dlx vercel@latest deploy \
            --prod \
            --token "$STAGING_VERCEL_TOKEN" \
            --archive=tgz \
            --build-env API_BASE_URL="$STAGING_API_BASE_URL" \
            --build-env NEXT_PUBLIC_API_BASE_URL="$STAGING_API_BASE_URL" \
            --env API_BASE_URL="$STAGING_API_BASE_URL" \
            --env NEXT_PUBLIC_API_BASE_URL="$STAGING_API_BASE_URL"
