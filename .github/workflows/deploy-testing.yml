name: Deploy Testing

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-testing
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/shop-app-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/shop-app-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  bootstrap_database:
    runs-on: ubuntu-latest
    needs: verify
    environment: testing
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SUPER_ADMIN_EMAIL: ${{ secrets.TEST_SUPER_ADMIN_EMAIL }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.TEST_SUPER_ADMIN_PASSWORD }}
      SUPER_ADMIN_FIRST_NAME: ${{ secrets.TEST_SUPER_ADMIN_FIRST_NAME }}
      SUPER_ADMIN_LAST_NAME: ${{ secrets.TEST_SUPER_ADMIN_LAST_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:testing:bootstrap
      - if: ${{ env.SUPER_ADMIN_EMAIL != '' && env.SUPER_ADMIN_PASSWORD != '' && env.SUPER_ADMIN_FIRST_NAME != '' && env.SUPER_ADMIN_LAST_NAME != '' }}
        run: pnpm deploy:testing:seed-admin

  build_images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:testing-latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            API_BASE_URL=http://api:4000
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:testing-latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - bootstrap_database
      - build_images
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_DEPLOY_HOST }}
          username: ${{ secrets.TEST_DEPLOY_USER }}
          key: ${{ secrets.TEST_DEPLOY_SSH_KEY }}
          source: deploy/testing/docker-compose.yml
          target: ${{ secrets.TEST_DEPLOY_PATH }}
          strip_components: 2
      - uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.TEST_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.TEST_GHCR_TOKEN }}
          TEST_DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.TEST_AUTH_ACCESS_TOKEN_SECRET }}
          TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
          TEST_AUTH_COOKIE_SECURE: ${{ secrets.TEST_AUTH_COOKIE_SECURE }}
          TEST_GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
          TEST_GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
          TEST_GOOGLE_CALLBACK_URL: ${{ secrets.TEST_GOOGLE_CALLBACK_URL }}
          TEST_RESEND_API_KEY: ${{ secrets.TEST_RESEND_API_KEY }}
          TEST_EMAIL_FROM_ADDRESS: ${{ secrets.TEST_EMAIL_FROM_ADDRESS }}
          TEST_RESEND_WEBHOOK_SECRET: ${{ secrets.TEST_RESEND_WEBHOOK_SECRET }}
          TEST_R2_ACCOUNT_ID: ${{ secrets.TEST_R2_ACCOUNT_ID }}
          TEST_R2_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          TEST_R2_BUCKET: ${{ secrets.TEST_R2_BUCKET }}
          TEST_R2_PUBLIC_URL: ${{ secrets.TEST_R2_PUBLIC_URL }}
          TEST_WEB_PORT: ${{ secrets.TEST_WEB_PORT }}
        with:
          host: ${{ secrets.TEST_DEPLOY_HOST }}
          username: ${{ secrets.TEST_DEPLOY_USER }}
          key: ${{ secrets.TEST_DEPLOY_SSH_KEY }}
          envs: API_IMAGE,WEB_IMAGE,GHCR_USERNAME,GHCR_TOKEN,TEST_DEPLOY_PATH,TEST_DATABASE_URL,TEST_AUTH_ACCESS_TOKEN_SECRET,TEST_WEB_BASE_URL,TEST_AUTH_COOKIE_SECURE,TEST_GOOGLE_CLIENT_ID,TEST_GOOGLE_CLIENT_SECRET,TEST_GOOGLE_CALLBACK_URL,TEST_RESEND_API_KEY,TEST_EMAIL_FROM_ADDRESS,TEST_RESEND_WEBHOOK_SECRET,TEST_R2_ACCOUNT_ID,TEST_R2_ACCESS_KEY_ID,TEST_R2_SECRET_ACCESS_KEY,TEST_R2_BUCKET,TEST_R2_PUBLIC_URL,TEST_WEB_PORT
          script: |
            set -eu
            mkdir -p "$TEST_DEPLOY_PATH"
            AUTH_COOKIE_SECURE_VALUE="${TEST_AUTH_COOKIE_SECURE:-true}"
            GOOGLE_CALLBACK_URL_VALUE="${TEST_GOOGLE_CALLBACK_URL:-${TEST_WEB_BASE_URL%/}/api/auth/oauth/google/callback}"
            WEB_PORT_VALUE="${TEST_WEB_PORT:-3000}"
            cat > "$TEST_DEPLOY_PATH/.env" <<EOF
            SHOP_API_IMAGE=${API_IMAGE}
            SHOP_WEB_IMAGE=${WEB_IMAGE}
            DATABASE_URL=${TEST_DATABASE_URL}
            AUTH_ACCESS_TOKEN_SECRET=${TEST_AUTH_ACCESS_TOKEN_SECRET}
            AUTH_ACCESS_TOKEN_TTL_SECONDS=900
            AUTH_REFRESH_TOKEN_TTL_SECONDS=604800
            AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE_VALUE}
            NODE_ENV=production
            WEB_BASE_URL=${TEST_WEB_BASE_URL}
            API_BASE_URL=http://api:4000
            EMAIL_FROM_ADDRESS=${TEST_EMAIL_FROM_ADDRESS}
            RESEND_API_KEY=${TEST_RESEND_API_KEY}
            RESEND_WEBHOOK_SECRET=${TEST_RESEND_WEBHOOK_SECRET}
            GOOGLE_CLIENT_ID=${TEST_GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${TEST_GOOGLE_CLIENT_SECRET}
            GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL_VALUE}
            R2_ACCOUNT_ID=${TEST_R2_ACCOUNT_ID}
            R2_ACCESS_KEY_ID=${TEST_R2_ACCESS_KEY_ID}
            R2_SECRET_ACCESS_KEY=${TEST_R2_SECRET_ACCESS_KEY}
            R2_BUCKET=${TEST_R2_BUCKET}
            R2_PUBLIC_URL=${TEST_R2_PUBLIC_URL}
            WEB_PORT=${WEB_PORT_VALUE}
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose -f "$TEST_DEPLOY_PATH/docker-compose.yml" --env-file "$TEST_DEPLOY_PATH/.env" pull
            docker compose -f "$TEST_DEPLOY_PATH/docker-compose.yml" --env-file "$TEST_DEPLOY_PATH/.env" up -d --remove-orphans
