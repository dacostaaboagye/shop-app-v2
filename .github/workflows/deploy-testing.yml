name: Deploy Testing

on:
  push:
    branches:
      - testing
  workflow_dispatch:

concurrency:
  group: deploy-testing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  bootstrap_database:
    runs-on: ubuntu-latest
    needs: verify
    environment: testing
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SUPER_ADMIN_EMAIL: ${{ secrets.TEST_SUPER_ADMIN_EMAIL }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.TEST_SUPER_ADMIN_PASSWORD }}
      SUPER_ADMIN_FIRST_NAME: ${{ secrets.TEST_SUPER_ADMIN_FIRST_NAME }}
      SUPER_ADMIN_LAST_NAME: ${{ secrets.TEST_SUPER_ADMIN_LAST_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify testing database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::TEST_DATABASE_URL is not configured."
            exit 1
          fi
          echo "Testing database URL is configured."
      - name: Show current migration state
        run: |
          psql "$DATABASE_URL" -c "SELECT id, hash, created_at FROM drizzle.__drizzle_migrations ORDER BY created_at;" 2>&1 \
            || echo "Migration table not found or DB unreachable"
        continue-on-error: true
      - name: Run testing database migration
        env:
          NO_COLOR: "1"
        run: |
          pnpm --filter @shop/database db:migrate > /tmp/migrate-output.log 2>&1
          EXIT_CODE=$?
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/migrate-output.log | tr '\r' '\n' | grep -v '^[[:space:]]*$'
          exit $EXIT_CODE
      - name: Seed core testing data
        run: pnpm --filter @shop/api db:seed-core
      - if: ${{ env.SUPER_ADMIN_EMAIL != '' && env.SUPER_ADMIN_PASSWORD != '' && env.SUPER_ADMIN_FIRST_NAME != '' && env.SUPER_ADMIN_LAST_NAME != '' }}
        run: pnpm deploy:testing:seed-admin

  deploy_api:
    runs-on: ubuntu-latest
    needs: bootstrap_database
    environment: testing
    env:
      FLY_API_TOKEN: ${{ secrets.TEST_FLY_API_TOKEN }}
      TEST_FLY_APP_NAME: ${{ secrets.TEST_FLY_APP_NAME }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.TEST_AUTH_ACCESS_TOKEN_SECRET }}
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_AUTH_COOKIE_SECURE: ${{ secrets.TEST_AUTH_COOKIE_SECURE }}
      TEST_GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
      TEST_GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
      TEST_GOOGLE_CALLBACK_URL: ${{ secrets.TEST_GOOGLE_CALLBACK_URL }}
      TEST_RESEND_API_KEY: ${{ secrets.TEST_RESEND_API_KEY }}
      TEST_EMAIL_FROM_ADDRESS: ${{ secrets.TEST_EMAIL_FROM_ADDRESS }}
      TEST_RESEND_WEBHOOK_SECRET: ${{ secrets.TEST_RESEND_WEBHOOK_SECRET }}
      TEST_R2_ACCOUNT_ID: ${{ secrets.TEST_R2_ACCOUNT_ID }}
      TEST_R2_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
      TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
      TEST_R2_BUCKET: ${{ secrets.TEST_R2_BUCKET }}
      TEST_R2_PUBLIC_URL: ${{ secrets.TEST_R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Sync testing secrets to Fly
        run: |
          cat <<EOF > fly.testing.secrets
          NODE_ENV=production
          DATABASE_URL=${TEST_DATABASE_URL}
          AUTH_ACCESS_TOKEN_SECRET=${TEST_AUTH_ACCESS_TOKEN_SECRET}
          AUTH_ACCESS_TOKEN_TTL_SECONDS=900
          AUTH_REFRESH_TOKEN_TTL_SECONDS=604800
          AUTH_COOKIE_SECURE=${TEST_AUTH_COOKIE_SECURE:-true}
          WEB_BASE_URL=${TEST_WEB_BASE_URL}
          EMAIL_FROM_ADDRESS=${TEST_EMAIL_FROM_ADDRESS}
          GOOGLE_CLIENT_ID=${TEST_GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${TEST_GOOGLE_CLIENT_SECRET}
          GOOGLE_CALLBACK_URL=${TEST_GOOGLE_CALLBACK_URL:-${TEST_WEB_BASE_URL%/}/api/auth/oauth/google/callback}
          RESEND_API_KEY=${TEST_RESEND_API_KEY}
          RESEND_WEBHOOK_SECRET=${TEST_RESEND_WEBHOOK_SECRET}
          R2_ACCOUNT_ID=${TEST_R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${TEST_R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${TEST_R2_SECRET_ACCESS_KEY}
          R2_BUCKET=${TEST_R2_BUCKET}
          R2_PUBLIC_URL=${TEST_R2_PUBLIC_URL}
          EOF
          flyctl secrets import --app "$TEST_FLY_APP_NAME" < fly.testing.secrets
      - name: Deploy API and worker to Fly
        run: |
          flyctl deploy \
            --remote-only \
            --config apps/api/fly.testing.toml \
            --app "$TEST_FLY_APP_NAME"
      - name: Ensure API and worker process groups are running
        run: |
          flyctl scale count \
            api=1 \
            worker=1 \
            --yes \
            --app "$TEST_FLY_APP_NAME"

  deploy_web:
    runs-on: ubuntu-latest
    needs: deploy_api
    environment: testing
    env:
      VERCEL_ORG_ID: ${{ secrets.TEST_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.TEST_VERCEL_PROJECT_ID }}
      TEST_VERCEL_TOKEN: ${{ secrets.TEST_VERCEL_TOKEN }}
      TEST_API_BASE_URL: ${{ secrets.TEST_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$TEST_VERCEL_TOKEN" ] && missing="$missing TEST_VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          [ -z "$TEST_API_BASE_URL" ] && missing="$missing TEST_API_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
      - name: Pull Vercel project settings
        run: |
          pnpm dlx vercel@latest pull \
            --yes \
            --environment=production \
            --token "$TEST_VERCEL_TOKEN"
      - name: Deploy web to Vercel testing project
        run: |
          pnpm dlx vercel@latest deploy \
            --prod \
            --token "$TEST_VERCEL_TOKEN" \
            --archive=tgz \
            --build-env API_BASE_URL="$TEST_API_BASE_URL" \
            --env API_BASE_URL="$TEST_API_BASE_URL"
